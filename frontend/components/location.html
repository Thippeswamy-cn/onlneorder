<dialog class="location-dialog" id="location-dialog" aria-labelledby="location-dialog-title">
        <div class="location-dialog-header">
            <div>
                <span class="section-kicker">Your position</span>
                <h2 id="location-dialog-title">Live location</h2>
            </div>
            <button class="location-close" id="location-close" type="button" aria-label="Close location map">&times;</button>
        </div>
        <form class="location-search" id="location-search">
            <label class="sr-only" for="location-search-input">Search a place in Google Maps</label>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <input id="location-search-input" type="search" placeholder="Search area, street or landmark" autocomplete="off">
            <button type="submit">Search</button>
        </form>
        <div class="location-search-results" id="location-search-results" role="listbox" aria-label="Address search results" hidden></div>
        <div class="live-map-wrap">
            <iframe id="live-location-map" title="Your live location on Google Maps" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen hidden></iframe>
            <div class="location-placeholder" id="location-placeholder">
                <span class="location-spinner" aria-hidden="true"></span>
                <strong>Finding your location…</strong>
                <small>Please allow location access when your browser asks.</small>
            </div>
        </div>
        <div class="location-name" id="location-name" hidden>
            <small>Current area</small>
            <strong id="location-name-text">Finding area name…</strong>
            <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">Area data © OpenStreetMap contributors</a>
        </div>
        <p class="location-status" id="location-status" role="status" aria-live="polite">Waiting for location permission.</p>
        <p class="location-tip" id="location-tip" hidden></p>
        <div class="location-details" id="location-details" hidden>
            <span><small>Latitude</small><strong id="live-latitude">—</strong></span>
            <span><small>Longitude</small><strong id="live-longitude">—</strong></span>
            <span><small>Accuracy</small><strong id="live-accuracy">—</strong></span>
        </div>
        <div class="location-actions">
            <button class="secondary-button" id="location-retry" type="button">Use my current location</button>
            <a class="primary-button" id="location-maps-link" href="#" target="_blank" rel="noopener noreferrer" hidden>Open in Google Maps</a>
            <button class="primary-button" id="location-done" type="button">Done</button>
        </div>
    </dialog>
