<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Switch between LocalConnect user and worker dashboards">
    <title>Dashboards - LocalConnect</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <header class="dashboard-header">
        <div class="header-inner">
            <nav class="dashboard-switch" aria-label="Choose dashboard">
                <button class="active" type="button" data-dashboard="user" aria-pressed="true">User Dashboard</button>
                <button type="button" data-dashboard="worker" aria-pressed="false">Worker Dashboard</button>
            </nav>
            <a class="back-home" href="home.html">Back to home</a>
        </div>
    </header>

    <main class="dashboard-shell">
        <section class="dashboard-frame active" data-dashboard-panel="user">
            <iframe id="user-dashboard-frame" title="User dashboard" src="customer-dashboard.html"></iframe>
        </section>
        <section class="dashboard-frame" data-dashboard-panel="worker" hidden>
            <iframe id="worker-dashboard-frame" title="Worker dashboard" src="worker-dashboard.html"></iframe>
        </section>
    </main>

    <script src="dashboard.js"></script>
</body>
</html>
