<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worker signup — LocalConnect</title>
  <link rel="stylesheet" href="signup.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="signup-choice.html" aria-label="LocalConnect">
      <span class="brand-mark">L</span>
      <span>Local<strong>Connect</strong></span>
    </a>
    <nav class="top-nav" aria-label="Main navigation">
      <a href="signup-choice.html">Signup</a>
      <a href="signin.html">Sign in</a>
    </nav>
  </header>

  <main class="signup-shell">
    <section class="intro-panel">
      <p class="eyebrow">Worker Signup</p>
      <h1>Create your worker account</h1>
      <p>Register your service details so customers can book you.</p>
      <a class="back-link" href="signup-choice.html">Choose another signup type</a>
    </section>

    <section class="form-card">
      <div class="otp-box" data-otp-gate data-otp-method="email">
        <h2>Verify before signup</h2>
        <label>
          Email address
          <input type="email" data-otp-contact placeholder="you@example.com" required>
        </label>
        <div class="otp-row">
          <button class="secondary-button" type="button" data-send-otp>Send OTP</button>
          <input type="text" data-otp-input inputmode="numeric" maxlength="6" placeholder="Enter OTP" disabled>
          <button class="secondary-button" type="button" data-verify-otp disabled>Verify</button>
        </div>
        <p class="otp-message" data-otp-message></p>
      </div>

      <form id="workerSignupForm">
        <fieldset disabled data-signup-fields>
        <label>
          Full name
          <input type="text" name="name" placeholder="Enter your full name" required>
        </label>
        <label>
          Email address
          <input type="email" name="email" placeholder="you@example.com" required>
        </label>
        <label>
          Phone number
          <input type="tel" name="phone" placeholder="9876543210" required>
        </label>
        <label>
          Service category
          <select name="service" required>
            <option value="">Choose a service</option>
            <option>Home repair</option>
            <option>Transport</option>
            <option>Car repair</option>
            <option>Painting</option>
            <option>Carpentry</option>
            <option>Appliance repair</option>
          </select>
        </label>
        <label>
          Experience
          <input type="text" name="experience" placeholder="Example: 3 years" required>
        </label>
        <label>
          Work area
          <textarea name="workArea" rows="3" placeholder="Enter areas where you can work" required></textarea>
        </label>
        <label>
          Password
          <input type="password" name="password" placeholder="Create a password" required>
        </label>
        <button type="submit">Create worker account</button>
        </fieldset>
      </form>
    </section>
  </main>

  <script src="signup.js"></script>
</body>
</html>
