<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — LocalConnect</title>
  <link rel="stylesheet" href="signup.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="signup-choice.html" aria-label="LocalConnect">
      <span class="brand-mark">L</span>
      <span>
        Local<strong>Connect</strong>
      </span>
    </a>
    <nav class="top-nav" aria-label="Main navigation">
      <a href="signin.html">Sign in</a>
      <a href="signup-choice.html">Signup</a>
    </nav>
  </header>

  <main class="signin-page">
    <section class="form-card signin-card">
      <div class="form-title">
        <span class="choice-icon">IN</span>
        <div>
          <h2>Sign in</h2>
          <p>Use the email and password from your new account.</p>
        </div>
      </div>

      <form id="signinForm">
        <label>
          Email address
          <input type="email" name="email" placeholder="you@example.com" required>
        </label>
        <label>
          Password
          <input type="password" name="password" placeholder="Enter your password" required>
        </label>
        <button class="forgot-password-button" type="button" id="forgotPasswordButton">Forgot password?</button>
        <div class="reset-password-panel" data-reset-panel hidden>
          <label>
            Reset OTP
            <input type="text" name="resetOtp" placeholder="Enter 6-digit OTP" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required disabled>
          </label>
          <button class="secondary-button" type="button" id="verifyResetOtpButton" disabled>Verify OTP</button>
          <fieldset data-reset-password-fields disabled hidden>
            <label>
              New password
              <input type="password" name="newPassword" placeholder="Enter new password" minlength="4" required>
            </label>
            <label>
              Confirm password
              <input type="password" name="confirmPassword" placeholder="Confirm new password" minlength="4" required>
            </label>
            <button type="button" id="updatePasswordButton">Update password</button>
          </fieldset>
        </div>
        <button type="submit">Sign in</button>
        <p class="otp-message" id="signinMessage"></p>
      </form>

      <a class="back-link" href="signup-choice.html">Create account</a>
    </section>
  </main>

  <script src="signup.js"></script>
</body>
</html>
