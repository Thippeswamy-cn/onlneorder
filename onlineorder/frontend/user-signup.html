<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User signup — LocalConnect</title>
  <link rel="stylesheet" href="signup.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="signup-choice.html" aria-label="LocalConnect">
      <span class="brand-mark">L</span>
      <span>Local<strong>Connect</strong></span>
    </a>
    <nav class="top-nav" aria-label="Main navigation">
      <a href="signup-choice.html">Signup</a>
      <a href="signin.html">Sign in</a>
    </nav>
  </header>

  <main class="signup-shell">
    <section class="intro-panel">
      <p class="eyebrow">User Signup</p>
      <h1>Create your user account</h1>
      <p>Sign up to book services from trusted workers near you.</p>
      <a class="back-link" href="signup-choice.html">Choose another signup type</a>
    </section>

    <section class="form-card">
      <div class="otp-box" data-otp-gate data-otp-method="email">
        <h2>Verify before signup</h2>
        <label>
          Email address
          <input type="email" data-otp-contact placeholder="you@example.com" required>
        </label>
        <div class="otp-row">
          <button class="secondary-button" type="button" data-send-otp>Send OTP</button>
          <input type="text" data-otp-input inputmode="numeric" maxlength="6" placeholder="Enter OTP" disabled>
          <button class="secondary-button" type="button" data-verify-otp disabled>Verify</button>
        </div>
        <p class="otp-message" data-otp-message></p>
      </div>

      <form id="userSignupForm">
        <fieldset disabled data-signup-fields>
        <label>
          Full name
          <input type="text" name="name" placeholder="Enter your full name" required>
        </label>
        <label>
          Email address
          <input type="email" name="email" placeholder="you@example.com" required>
        </label>
        <label>
          Phone number
          <input type="tel" name="phone" placeholder="9876543210" required>
        </label>
        <label>
          Address
          <textarea name="address" rows="3" placeholder="Enter your address" required></textarea>
        </label>
        <label>
          Password
          <input type="password" name="password" placeholder="Create a password" required>
        </label>
        <button type="submit">Create user account</button>
        </fieldset>
      </form>
    </section>
  </main>

  <script src="signup.js"></script>
</body>
</html>
